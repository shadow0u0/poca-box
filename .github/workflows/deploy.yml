name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer commit wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The allowlist is written once in firebase/allowlist.json and copied into
      # the Firestore rules and the photo Worker. Nothing at runtime would
      # notice if a generated copy were edited by hand and drifted, so the
      # build is where that gets caught.
      - run: npm run allowlist:check

      - run: npm run build

      # Pages must already be enabled with source "GitHub Actions" in the
      # repository settings. The action's `enablement` option cannot do it for
      # us — the workflow token is refused with "Resource not accessible by
      # integration" when it tries to create the Pages site.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
