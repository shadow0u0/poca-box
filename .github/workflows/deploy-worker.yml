name: Deploy photo worker

# Deploys the R2 photo Worker from CI so it never needs a local toolchain.
# Requires two repository secrets, both created by clicking through the
# Cloudflare dashboard — see worker/README.md:
#   CLOUDFLARE_API_TOKEN   (template: "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      # The Worker bundles the allowlist, so adding a friend must redeploy it —
      # editing only allowlist.json would otherwise leave the photo half of the
      # gate on yesterday's list.
      - 'firebase/allowlist.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      # Fail with an explanation rather than a wall of wrangler output when the
      # secrets have not been added yet.
      - name: Check credentials are present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::缺少 repository secret:$missing"
            echo "請到 GitHub → Settings → Secrets and variables → Actions 新增，"
            echo "取得方式見 worker/README.md。"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
